version: "3.9"

# ────────────────────────────────────────────────────────────────
# 사주담 (Saju Wellness) — Docker Compose
#
# 빠른 시작:
#   git clone https://github.com/noivan0/saju-wellness.git
#   cd saju-wellness
#   cp .env.example .env        # DB_PASSWORD, SECRET_KEY, ANTHROPIC_API_KEY 설정
#   docker compose up -d
#   # http://localhost:8002/app
# ────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saju-wellness-api
    ports:
      - "${HOST_PORT:-8002}:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: saju-wellness-db
    environment:
      POSTGRES_DB: ${DB_NAME:-saju_db}
      POSTGRES_USER: ${DB_USER:-saju}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-saju_secret}
    volumes:
      - saju_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-saju} -d ${DB_NAME:-saju_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: saju-wellness-redis
    restart: unless-stopped
    volumes:
      - saju_redis_data:/data

volumes:
  saju_db_data:
  saju_redis_data:
